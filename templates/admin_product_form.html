{% extends "base.html" %}{% block content %}<section class="container page admin-form"><h1>{{'Edit Product' if p else 'Add Product'}}</h1><form method="post" class="form-card"><label>Product Name<input name="name" value="{{p.name if p else ''}}" required></label><label>Category<input name="category" value="{{p.category if p else 'T-Shirt'}}"></label><label>Image URL<input name="image_url" value="{{p.image_url if p else ''}}" placeholder="https://..."></label><div class="two"><label>Original Price<input type="number" name="original_price" value="{{p.original_price if p else ''}}" required></label><label>Offer Price<input type="number" name="sale_price" value="{{p.sale_price if p else ''}}" required></label></div><label>Stock<input type="number" name="stock" value="{{p.stock if p else 0}}" required></label><label>Description<textarea name="description">{{p.description if p else ''}}</textarea></label><label class="check"><input type="checkbox" name="active" {{'checked' if not p or p.active}}> Active</label><label class="check"><input type="checkbox" name="featured" {{'checked' if p and p.featured}}> Featured</label><button class="btn gold block">Save Product</button></form></section>{% endblock %}
