{% extends "base.html" %}{% block content %}<section class="container checkout page"><div><h1>Checkout</h1><form method="post" class="form-card"><label>Full Name<input name="name" required></label><label>Email (for order updates)<input type="email" name="email"></label><label>Phone<input name="phone" required></label><label>Full Address<textarea name="address" required></textarea></label><label>Order Note<textarea name="note"></textarea></label><p class="muted">Payment: Cash on Delivery</p><button class="btn gold block">Place Order</button></form></div><aside class="summary"><h3>Order Summary</h3>{% for p,q in items %}<p>{{p.name}} × {{q}} <b>{{money(p.sale_price*q)}}</b></p>{% endfor %}<hr><p>Subtotal <b>{{money(subtotal)}}</b></p><p>Delivery <b>{{money(delivery)}}</b></p><h3>Total {{money(subtotal+delivery)}}</h3></aside></section>{% endblock %}
