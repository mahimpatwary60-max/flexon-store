{% extends "base.html" %}{% block content %}<section class="container page"><h1>Your Cart</h1>{% if items %}<form method="post" action="{{url_for('cart_update')}}"><div class="cart-list">{% for p,qty in items %}<div class="cart-row"><div><b>{{p.name}}</b><div class="muted">{{money(p.sale_price)}} each</div></div><input type="number" min="0" max="{{p.stock}}" name="qty_{{p.id}}" value="{{qty}}"><b>{{money(p.sale_price*qty)}}</b></div>{% endfor %}</div><div class="cart-total"><span>Subtotal</span><b>{{money(subtotal)}}</b></div><button class="btn">Update Cart</button> <a class="btn gold" href="{{url_for('checkout')}}">Checkout</a></form>{% else %}<p>Your cart is empty.</p><a class="btn gold" href="{{url_for('home')}}">Continue Shopping</a>{% endif %}</section>{% endblock %}
